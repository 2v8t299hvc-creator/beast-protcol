name: Game checks
on:
  push:
    paths:
      - index.html
      - 'assets/**'
      - 'tools/**'
      - 'tests/**'
      - .github/workflows/validate-content.yml
  pull_request:
    paths:
      - index.html
      - 'assets/**'
      - 'tools/**'
      - 'tests/**'
      - .github/workflows/validate-content.yml
  workflow_dispatch:
    inputs:
      suite:
        description: Checks to run
        type: choice
        default: smoke
        options: [smoke, content, combat, com, ui, records, maintained]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run selected game checks
        env:
          TEST_SUITE: ${{ inputs.suite || 'smoke' }}
        run: |
          if [ "$TEST_SUITE" = maintained ]; then
            node tools/test.cjs --maintained
          else
            node tools/test.cjs --suite "$TEST_SUITE"
          fi
