function validateItemDefinitions(definitions,sheets){
 const ids=new Set();
 for(const item of definitions){
  if(!item.id||ids.has(item.id)||!item.name)throw new Error('Duplicate or unnamed item: '+item.id);ids.add(item.id);
  if(item.displayOrder!=null&&(!Number.isInteger(item.displayOrder)||item.displayOrder<0))throw new Error('Invalid item display order: '+item.id);
  if(item.rarity&&!['common','uncommon','rare','epic','legendary'].includes(item.rarity))throw new Error('Invalid item rarity: '+item.id);
  const equipment=item.equipment;
  if(equipment){
   if(!['weapon','head','arm','body','legs','accessory'].includes(equipment.slot)||!Number.isFinite(equipment.attack)||!Number.isFinite(equipment.defense))throw new Error('Invalid equipment stats: '+item.id);
   if(equipment.slot==='weapon'&&!['fist','slash','hammer','bow','gun'].includes(equipment.weaponType))throw new Error('Invalid equipment weapon type: '+item.id);
   if(equipment.ammoType&&(!['bullets','arrows'].includes(equipment.ammoType)||!(equipment.capacity>=0)))throw new Error('Invalid equipment ammo: '+item.id);
  }
  if(item.recovery&&(!['hp','stamina'].includes(item.recovery.group)||!Number.isFinite(item.recovery.amount)||item.recovery.amount<=0))throw new Error('Invalid recovery item: '+item.id);
  if(item.art&&(!Array.isArray(item.art)||!sheets[item.art[0]]||!Number.isInteger(item.art[1])||item.art[1]<0||item.art[1]>3||(item.art[2]&&item.art[2]!=='single')))throw new Error('Invalid item art: '+item.id);
  if(item.skillIcon&&(!item.skillIcon.id||!item.skillIcon.art))throw new Error('Invalid equipment skill icon: '+item.id);
  if(item.startingWeapon&&equipment?.slot!=='weapon')throw new Error('Invalid starting weapon: '+item.id);
  for(const field of ['carryLimit','findCount'])if(item[field]!=null&&(!Number.isInteger(item[field])||item[field]<=0))throw new Error('Invalid item quantity: '+item.id+'/'+field);
 }
 for(const item of definitions)for(const recipe of item.recipes||[]){
  if(!['item','weapon','armor'].includes(recipe.category)||!recipe.need||!Object.keys(recipe.need).length||Object.entries(recipe.need).some(([id,count])=>!ids.has(id)||!Number.isInteger(count)||count<=0)||(recipe.count!=null&&(!Number.isInteger(recipe.count)||recipe.count<=0)))throw new Error('Invalid item recipe: '+item.id);
 }
 return true;
}
function buildItemTables(definitions,sheets,order={}){
 validateItemDefinitions(definitions,sheets);
 const tables={};
 for(const [table,field]of Object.entries({names:'name',EQUIPMENT_DEFS:'equipment',EQUIPMENT_SPECIAL_EFFECTS:'effect',RECIPE_RARITY:'rarity',RECOVERY_ITEMS:'recovery',itemArt:'art',itemFallback:'fallback',ITEM_CRAFT_GROUP:'craftGroup',AMMO_LIMITS:'carryLimit'})){
  const entries=definitions.filter(item=>Object.hasOwn(item,field));
  const positions=new Map((order[field]||[]).map((id,index)=>[id,index]));
  entries.sort((a,b)=>(positions.get(a.id)??Infinity)-(positions.get(b.id)??Infinity));
  tables[table]=Object.fromEntries(entries.map(item=>[item.id,item[field]]));
 }
 tables.recipes=definitions.flatMap(item=>(item.recipes||[]).map(recipe=>({id:item.id,name:item.name,...recipe}))).sort((a,b)=>(a.order??Infinity)-(b.order??Infinity)).map(({order,...recipe})=>recipe);
 tables.itemArtSheets=sheets;
 tables.FISH_ITEMS=new Set(definitions.filter(item=>item.singleStack).map(item=>item.id));
 tables.PRACTICE_WEAPONS=Object.fromEntries(definitions.filter(item=>item.startingWeapon).map(item=>[item.id,[item.name,item.equipment.weaponType]]));
 return tables;
}

function validateCharacterDefinitions(definitions){
 const ids=new Set(),skillIds=new Set();
 for(const c of definitions){
  if(!c.id||ids.has(c.id))throw new Error('Duplicate or missing character id: '+c.id);ids.add(c.id);
  if(!c.name||!c.art||!c.emoji)throw new Error('Missing character presentation: '+c.id);
  if(!Array.isArray(c.statTargets)||c.statTargets.length!==8||!c.statTargets.every(n=>Number.isFinite(n)&&n>0))throw new Error('Invalid character stats: '+c.id);
  if(!Array.isArray(c.weaponTypes)||c.weaponTypes.some(t=>!['fist','slash','hammer','bow','gun'].includes(t))||(c.weapon&&!c.weaponTypes.includes(c.weapon)))throw new Error('Invalid character weapon types: '+c.id);
  if(Object.entries(c.initialMastery||{}).some(([t,n])=>!c.weaponTypes.includes(t)||!Number.isFinite(n)||n<0))throw new Error('Invalid initial mastery: '+c.id);
  if(c.randomWeaponMastery!=null&&(!Number.isFinite(c.randomWeaponMastery)||c.randomWeaponMastery<0))throw new Error('Invalid random mastery: '+c.id);
  if(!Array.isArray(c.skins)||!c.skins.some(s=>s.id==='default')||new Set(c.skins.map(s=>s.id)).size!==c.skins.length||c.skins.some(s=>!s.id||!s.name||(s.id!=='default'&&!s.art)))throw new Error('Invalid character skins: '+c.id);
  for(const [kind,skill] of Object.entries(c.skills||{})){
   if(!['passive','field','active'].includes(kind)||!skill.id||skillIds.has(skill.id)||!skill.name||!skill.description||!skill.icon||(kind!=='passive'&&!(skill.cooldownMs>0)))throw new Error('Invalid character skill: '+c.id+'/'+kind);
   skillIds.add(skill.id);
  }
 }
 return true;
}

function craftConsumption(r,actor=S){

  let left=count,fromBag=Math.min(totalIn(stacks,id),left);
  if(fromBag){stacks=removeFromStacks(stacks,id,fromBag);left-=fromBag}
  if(left){const slot=Object.keys(equipment).find(k=>equipment[k]===id);if(slot&&left===1){equipment[slot]=null;delete equipmentAmmo[slot];delete equipmentEffects[slot];left--}}

}

  rarityNamePattern=new RegExp([...rarityNameIds.keys()].sort((a,b)=>b.length-a.length).map(escape).join('|'),'g');
 }
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];let node;
 while(node=walker.nextNode()){
  if(!node.nodeValue||!node.parentElement||node.parentElement.closest('.bp-rarity-name,script,style,.bp-item-art'))continue;
  rarityNamePattern.lastIndex=0;if(rarityNamePattern.test(node.nodeValue))nodes.push(node);
 }
 for(const text of nodes){
  const fragment=document.createDocumentFragment();let start=0;
  rarityNamePattern.lastIndex=0;
  for(const match of text.nodeValue.matchAll(rarityNamePattern)){
   if(match[0].length===1&&/[一-龯ぁ-ゖァ-ヺ]/.test((text.nodeValue[match.index-1]||'')+(text.nodeValue[match.index+1]||'')))continue;
   if(match.index>start)fragment.appendChild(document.createTextNode(text.nodeValue.slice(start,match.index)));
   const span=document.createElement('span');span.className='bp-rarity-name';
   span.dataset.rarity=RECIPE_RARITY[rarityNameIds.get(match[0])]||'common';span.textContent=match[0];fragment.appendChild(span);
   start=match.index+match[0].length;
  }
  if(start<text.nodeValue.length)fragment.appendChild(document.createTextNode(text.nodeValue.slice(start)));
  text.replaceWith(fragment);
 }
}

 const trackedBodies=bodies.filter(c=>razScentMarked(actor,c,now));const eligibleBodies=trackedBodies.length?trackedBodies:bodies;const body=eligibleBodies.length?eligibleBodies[rand(eligibleBodies.length)]:null;
 if(body&&Math.random()<corpseDiscoveryRate(body,actor)){razFindCorpse(actor,body,now);actor.loot=body.id;comLog(actor,'探索：死体を発見',now);return}

function updateComActors(now){
 if(!matchClock||matchClock.ended)return;
 while(!matchClock.ended){
  const due=comActors.filter(a=>a.hp>0&&a.nextActionAt<=now),counterAt=Math.min(Infinity,...delayedDroneCounters.filter(x=>x.dueAt<=now).map(x=>x.dueAt));
  const pendingAt=pvpEnabled()?Math.min(S.pvpPending?.dueAt??Infinity,S.pvpFeedback?.until??Infinity):Infinity,pvpAt=pendingAt<=now?pendingAt:Infinity;
  if(!due.length&&counterAt===Infinity&&pvpAt===Infinity)break;
  const at=Math.min(counterAt,pvpAt,...due.map(a=>a.nextActionAt));
  updatePvpTimeline(at);if(matchClock.ended)break;updateDelayedDroneCounters(at);if(matchClock.ended)break;updateDrones(at);pruneCorpses(at);
  // Rotate equal-time priority each second; this order is identical after a background resume.
  const offset=Math.floor((at-matchClock.startedAt)/COM_ACTION_MS)%comActors.length;
  const order=comActors.slice(offset).concat(comActors.slice(0,offset));
  for(const actor of order){
   if(matchClock.ended)break;
   if(actor.hp<=0||actor.nextActionAt>at)continue;
   actor.nextActionAt=at+COM_ACTION_MS+actionDelayMs(actor,at);
   if((actor.combatReadyAt||0)<=at)stepCom(actor,at);
   checkVictory(at);
  }
 }
}

// Pre-match reference view: reads catalog data without starting or advancing a match.
const encyclopediaState={query:'',category:'all',rarity:'all',area:'all',page:0,selected:null,history:[]};
const ENCYCLOPEDIA_PAGE_SIZE=30;
const ENCYCLOPEDIA_RARITIES={common:'コモン',uncommon:'アンコモン',rare:'レア',epic:'エピック',legendary:'レジェンダリー'};
function encyclopediaSources(id){
 const randomPlacement=id==='laurel'?'開始時、ランダムな3区画に各1個配置（場所は固定されません）':id==='dragon_scale'?'セクション5開始時、解放中のランダムな1区画に1個配置':null;
 return {areas:randomPlacement?[]:Object.entries(regionStock).filter(([,stock])=>stock[id]>0).map(([area,stock])=>({area,objects:stock[id],perObject:itemSetCount(id)})),drones:Object.entries(DRONE_DEFS).filter(([,d])=>d.drops.includes(id)).map(([kind,d])=>({kind,name:d.name,section:d.section})),random:isRandomSupplyItem(id),randomPlacement,practice:!!PRACTICE_WEAPONS[id],generated:GENERATED_MINERALS.includes(id),field:id==='herb'||id==='small_flower'};
}
function encyclopediaFilteredItems(state=encyclopediaState){
 const normalize=s=>String(s).normalize('NFKC').toLowerCase(),query=normalize(state.query||'').trim();
 const ordered=[...ITEM_DEFS].sort(compareItemDisplay);
 for(const item of ITEM_DEFS){if(!item.encyclopediaAfter)continue;const index=ordered.findIndex(i=>i.id===item.id);ordered.splice(index,1);const after=ordered.findIndex(i=>i.id===item.encyclopediaAfter);ordered.splice(after<0?ordered.length:after+1,0,item)}
 return ordered.filter(item=>{
  const def=item.equipment,category=state.category||'all';
  if(category==='weapon'&&def?.slot!=='weapon'||category==='armor'&&(!def||def.slot==='weapon')||category==='recovery'&&!item.recovery||category==='material'&&(def||item.recovery))return false;
  if(category.startsWith('material:')&&(def||item.recovery||(item.craftGroup||'other')!==category.slice(9)))return false;
  if(category.startsWith('weapon:')&&(def?.slot!=='weapon'||def.weaponType!==category.slice(7)))return false;
  if(category.startsWith('armor:')&&def?.slot!==category.slice(6))return false;
  if(state.rarity&&state.rarity!=='all'&&(item.rarity||'common')!==state.rarity)return false;
  if(state.area&&state.area!=='all'&&!encyclopediaSources(item.id).areas.some(x=>x.area===state.area))return false;
  return !query||normalize([item.name,item.id,item.effect?.name,item.effect?.description].filter(Boolean).join(' ')).includes(query);
 });
}
function encyclopediaLink(id,label=names[id]||id){return '<button type="button" class="bp-ency-link" data-rarity="'+(ITEM_BY_ID[id]?.rarity||'common')+'" onclick="encyclopediaSelectItem('+escapeCorpseText(JSON.stringify(id))+')">'+escapeCorpseText(label)+'</button>'}
function encyclopediaRecipeTree(id,count=1,path=[],budget={remaining:90}){
