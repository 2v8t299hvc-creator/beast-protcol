/* v1.3 — seamless character art and lighter lower-left HUD */
.leftchar{background:transparent!important;border:0!important;box-shadow:none!important;isolation:isolate;opacity:1}
.leftchar img{opacity:1!important;background:transparent!important;mix-blend-mode:normal!important;filter:drop-shadow(0 3px 7px rgba(0,0,0,.65))}
.status.panel{background:linear-gradient(90deg,rgba(5,12,21,.82),rgba(5,12,21,.46));border:0;border-radius:0 8px 8px 0;box-shadow:none;backdrop-filter:none}

/* Crafting cards: iPhone landscape friendly, preserve existing recipe rules. */
.bp-craft-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:9px;align-items:start}
.bp-craft-card{display:flex;flex-direction:column;gap:9px;min-width:0;padding:12px!important;border:1px solid #53677f!important;border-radius:12px!important;background:linear-gradient(150deg,#1c2b3e,#101923)!important}
.bp-craft-head{display:flex;align-items:center;gap:10px;min-width:0}
.bp-craft-head>.bp-item-art,.bp-craft-head>.itemIcon{width:42px;height:42px;flex-shrink:0;font-size:30px}
.bp-craft-info{display:flex;flex-direction:column;min-width:0;flex:1;gap:3px}
.bp-craft-info strong{font-size:clamp(12px,1.4vw,16px)}.bp-craft-info span{font-size:11px;color:#a9b9c9}
.bp-craft-status{font-size:10px;white-space:nowrap;border-radius:20px;padding:4px 7px}.bp-craft-status.ready{color:#baf6d0;background:#19633b88}.bp-craft-status.locked{color:#c9cad0;background:#4f536055}
.bp-craft-materials{display:flex;flex-wrap:wrap;gap:5px}.bp-craft-material{display:flex;align-items:center;gap:4px;min-width:0;padding:4px 6px;background:#070f1b;border-radius:7px;border:1px solid #36495d;font-size:11px}
.bp-craft-material>.bp-item-art,.bp-craft-material>.itemIcon{width:25px;height:25px;font-size:20px;flex-shrink:0}
.bp-craft-material-name{white-space:nowrap}.bp-craft-count{font-weight:700;font-variant-numeric:tabular-nums;color:#a5f0c4}.bp-craft-material.missing .bp-craft-count{color:#ff9999}
.bp-craft-card>button{width:100%;min-height:32px;margin-top:auto}

/* Discovery dialog: clear item illustration and thumb-friendly actions. */
.modalback:has(.bp-discovery) .modal{width:min(640px,94vw);max-height:min(88dvh,480px);padding:12px 16px;overflow:auto;border-radius:14px;border-color:#e0a154}
.modalback:has(.bp-discovery) .modal header{margin-bottom:5px;font-size:clamp(15px,2vw,20px)}
.bp-discovery{display:flex;flex-direction:column;gap:10px}
.bp-discovery-main{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,28px);padding:5px 8px}
.bp-discovery-preview{display:grid;place-items:center;width:clamp(86px,15vw,148px);height:clamp(86px,15vw,148px);flex-shrink:0;border:1px solid #8a9cae;border-radius:16px;background:radial-gradient(circle at center,#31435a,#101923 75%);box-shadow:inset 0 0 24px #ffffff15}
.bp-discovery-preview .bp-item-art{width:83%;height:83%;filter:drop-shadow(0 4px 6px #0009)}
.bp-discovery-preview .itemIcon{font-size:clamp(55px,8vw,90px);line-height:1}
.bp-discovery-detail{display:flex;flex-direction:column;gap:7px;min-width:0;align-items:flex-start}
.bp-discovery-label{font-size:10px;letter-spacing:.17em;color:#f9c78d;font-weight:800}
.bp-discovery-detail strong{font-size:clamp(18px,3vw,30px);line-height:1.12;overflow-wrap:anywhere}
.bp-discovery-area,.bp-discovery-count{font-size:clamp(11px,1.45vw,14px);color:#b7c9da}
.bp-discovery-actions{display:grid;grid-template-columns:1fr;gap:12px;width:100%}
.bp-discovery-actions button{min-height:clamp(48px,10vh,64px);margin:0;padding:12px 8px;font-size:clamp(13px,2vw,18px);font-weight:800;border-radius:12px;touch-action:manipulation}
.bp-discovery-take{background:linear-gradient(145deg,#ca7d28,#e9a548);border:2px solid #ffd18c;color:#17120b}
.bp-discovery-keep{background:#253951;border:2px solid #7995b0;color:#fff}
.bp-discovery-actions button:disabled{opacity:.4}
.bp-discovery-warning{margin:0;color:#ffb4a6;font-size:12px;text-align:center}
@media(max-height:390px){.modalback:has(.bp-discovery) .modal{padding:7px 12px}.bp-discovery{gap:5px}.bp-discovery-preview{width:75px;height:75px}.bp-discovery-main{padding:0}.bp-discovery-actions button{min-height:44px;padding:6px}.bp-discovery-detail{gap:3px}}

/* Item stock cards for landscape mobile */
.modalback:has(.bp-stock-panel) .modal{width:min(800px,95vw);padding:12px;max-height:88dvh;border-radius:12px}
.bp-stock-panel{display:flex;flex-direction:column;gap:9px}
.bp-stock-help{font-size:12px;color:#b8cce0;margin:0}
.bp-stock-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.bp-stock-card{min-width:0;padding:10px 6px;display:flex;align-items:center;flex-direction:column;gap:6px;border-radius:12px;background:linear-gradient(150deg,#233448,#111b29);border:1px solid #67829b;text-align:center}
.bp-stock-picture{width:clamp(56px,9vw,100px);height:clamp(56px,9vw,100px);display:grid;place-items:center;background:#172332;border:1px solid #5f768d;border-radius:12px}
.bp-stock-picture .bp-item-art{width:90%;height:90%}
.bp-stock-picture .itemIcon{font-size:clamp(38px,6vw,64px)}
.bp-stock-name{font-size:clamp(12px,1.7vw,17px);overflow-wrap:anywhere}
.bp-stock-detail{font-size:11px;color:#c1d0df}
.bp-stock-card button{width:100%;min-height:44px;border:1px solid #ffd18c;border-radius:10px;background:#b96d24;font-weight:800;font-size:clamp(12px,1.5vw,16px);margin-top:auto}
.bp-stock-card button:disabled{opacity:.45}
.bp-stock-empty{justify-content:center;border-style:dashed;opacity:.45;color:#bdd0e0}
.bp-stock-empty-symbol{font-size:34px}
.bp-stock-reason{font-size:10px;color:#ffc1ad}
.bp-stock-queue{margin:0;padding:7px 9px;border-radius:8px;background:#26384d;color:#ffda9c;font-size:12px}
@media(max-height:410px){.bp-stock-card{gap:3px;padding:5px}.bp-stock-picture{width:53px;height:53px}.bp-stock-card button{min-height:38px}.bp-stock-help{font-size:11px}}

/* Visual region selector. Full geographic map is intentionally postponed. */
.modalback:has(.bp-region-picker) .modal{width:min(980px,96vw);max-height:91dvh;padding:10px 12px;border-radius:12px}
.modalback:has(.bp-region-picker) .modal header{margin-bottom:7px}
.bp-region-guide{font-size:clamp(10px,1.5vw,13px);margin:0 0 9px;color:#c4d3e2}
.bp-region-guide b{color:#ffd29a}
.bp-region-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.bp-region-card{padding:0!important;position:relative;overflow:hidden;min-width:0;aspect-ratio:2.4/1;background:#192838;border:1px solid #8198ab;border-radius:10px!important;display:block;text-align:left;touch-action:manipulation}
.bp-region-image{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .15s}
.bp-region-card:active:not(:disabled) .bp-region-image{transform:scale(1.04)}
.bp-region-footer{position:absolute;inset:auto 0 0;min-height:34px;padding:6px 9px;display:flex;align-items:end;justify-content:space-between;gap:5px;text-shadow:0 1px 4px #000}
.bp-region-footer strong{font-size:clamp(11px,1.5vw,16px);white-space:nowrap}
.bp-region-footer small{font-size:clamp(9px,1.15vw,12px);white-space:nowrap;color:#ffd39b}
.bp-region-card.current{border:2px solid #ffc16d}
.bp-region-card.current:disabled{opacity:1}
.bp-region-card.current .bp-region-footer small{color:#a8f3c6}
@media(max-height:390px){.bp-region-grid{gap:5px}.bp-region-card{aspect-ratio:3.1/1}.bp-region-footer{min-height:26px;padding:3px 6px}}
@media(max-width:650px) and (orientation:landscape){.bp-region-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.bp-region-card{aspect-ratio:2.4/1}}

.bp-equip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:9px 0}.bp-equip-card{border:1px solid #678097;border-radius:8px;background:#19293a;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0}.bp-equip-item{display:flex;align-items:center;gap:5px;font-size:12px}.bp-equip-item .bp-item-art{width:26px;height:26px}.bp-equip-card small{color:#c2d0de}.bp-equip-card button{margin-top:auto}.bp-equip-stats{background:#22374b;border-radius:8px;padding:9px;font-size:13px;line-height:1.6}@media(max-width:600px){.bp-equip-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

function masteryRank(type){let n=masteryCount(type);for(let i=MASTERY_THRESHOLDS.length-1;i>=0;i--)if(n>=MASTERY_THRESHOLDS[i])return i;return 0}
function totalStat(stat){const atk=stat==='attack';return ACTOR_STATS[atk?'baseAttack':'baseDefense']+ACTOR_STATS[atk?'attackGrowth':'defenseGrowth']*(S.level-1)+Object.values(S.equipment).reduce((n,id)=>n+(equipmentDef(id)?.[stat]||0),0)}
function combatDamage(attack,defense,type,other=1){return Math.max(1,Math.floor(Math.max(1,attack-Math.max(0,defense)*0.5)*MASTERY_MULTIPLIERS[masteryRank(type)]*other))}
function addMastery(type,amount){if(!WEAPON_TYPES[type]||amount<=0)return;const before=masteryRank(type);S.masteryAttacks[type]=(S.masteryAttacks[type]||0)+amount;const after=masteryRank(type);if(after>before)addLog(WEAPON_TYPES[type]+'熟練度が'+MASTERY_RANKS[after]+'に上昇！')}

function craftConsumption(r){
 let stacks=S.bag.map(x=>({...x})),equipment={...S.equipment};
 for(const [id,count] of Object.entries(r.need)){
  let left=count,fromBag=Math.min(totalIn(stacks,id),left);
  if(fromBag){stacks=removeFromStacks(stacks,id,fromBag);left-=fromBag}
  if(left){const slot=Object.keys(equipment).find(k=>equipment[k]===id);if(slot&&left===1){equipment[slot]=null;left--}}
  if(left)return null;
 }return {stacks,equipment};
}

function loadStageImage(url,callback){
 if(artLoaded.has(url)){callback(true);return}
 if(artFailed.has(url)){callback(false);return}
 if(artLoading.has(url)){artLoading.get(url).push(callback);return}
 artLoading.set(url,[callback]);
 const img=new Image();
 img.onload=()=>{artLoaded.add(url);finish(true)};
 img.onerror=()=>{artFailed.add(url);finish(false)};
 function finish(ok){const callbacks=artLoading.get(url)||[];artLoading.delete(url);callbacks.forEach(fn=>fn(ok))}
 img.src=url;
}

const FISH_ITEMS=new Set(['swordfish','minefish','porcupinefish','paradisefish']);
function stackLimit(id){return FISH_ITEMS.has(id)||!!equipmentDef(id)?1:10}
function totalIn(stacks,id){return stacks.reduce((sum,x)=>sum+(x.id===id?x.count:0),0)}
function syncInventory(){const obj={};for(const x of S.bag)obj[x.id]=(obj[x.id]||0)+x.count;S.inventory=obj}
function occupied(stacks=S.bag){return stacks.length}
function addToStacks(stacks,id,count){
 const next=stacks.map(x=>({...x}));let left=count,lim=stackLimit(id);
 for(const x of next){if(x.id!==id||!left)continue;let n=Math.min(lim-x.count,left);x.count+=n;left-=n}
 while(left>0&&next.length<BAG_SLOTS){let n=Math.min(lim,left);next.push({id,count:n});left-=n}
 return left===0?next:null;
}
function removeFromStacks(stacks,id,count){
 let next=stacks.map(x=>({...x}));if(next.filter(x=>x.id===id).reduce((n,x)=>n+x.count,0)<count)return null;
 let left=count;for(let i=0;i<next.length&&left;){if(next[i].id!==id){i++;continue}const n=Math.min(left,next[i].count);next[i].count-=n;left-=n;if(!next[i].count)next.splice(i,1);else i++}return next;
}
function canReceive(id,inv=S.bag,count=1){return !!addToStacks(Array.isArray(inv)?inv:S.bag,id,count)}
function receive(id,count){const next=addToStacks(S.bag,id,count);if(!next)return false;S.bag=next;syncInventory();return true}
function takeFromBag(id,count){const next=removeFromStacks(S.bag,id,count);if(!next)return false;S.bag=next;syncInventory();return true}

function decideFound(take){

 if(take&&!canReceive(id,S.bag,obj.count||1))return toast('所持品がいっぱい');

 if(take){
  receive(id,obj.count||1);
  markObjectTaken(obj);
  addLog(names[id]+' ×'+(obj.count||1)+'を取得した');
  toast('✅ '+names[id]+' ×'+(obj.count||1)+'を取得');

  pushStock(obj);

function takeFound(i){
 if(S.busy||S.pendingFound)return toast('ほかの行動中です');
 if(i<0||i>=Math.min(S.found.length,FIND_SLOTS))return;
 const obj=S.found[i],id=stockItemId(obj);
 if(obj.dropped&&obj.area!==S.place)return toast('落とし物は'+obj.area+'で回収してね');
 if(!canReceive(id,S.bag,obj.count||1))return toast('所持品に全量入らない！');
 if(S.st<3)return toast('スタミナ不足！休息してね');
 S.busy=true;S.st-=3;refresh();toast('ストックを探索中…');
 setTimeout(()=>{
  const pos=S.found.indexOf(obj);
  if(pos>=0&&canReceive(id,S.bag,obj.count||1)&&(!obj.dropped||obj.area===S.place)){
   receive(id,obj.count||1);S.found.splice(pos,1);markObjectTaken(obj);
   addLog(names[id]+' ×'+(obj.count||1)+'を探索して回収した');
   toast('✅ '+names[id]+' ×'+(obj.count||1)+'を取得');

 },1000);
}

}

const regionStock={"山岳区画":{"stone":10,"wood":10,"mystery":3,"pickaxe":1,"wood_sword":2},"遺跡区画":{"stone":10,"mystery":5,"pickaxe":3,"survival_knife":2},"地下機構区画":{"scrap":10,"mystery":5,"oil":5},"神殿区画":{"marble":10,"mystery":5,"wood_sword":2},"工業区画":{"scrap":15,"lighter":5,"oil":8,"survival_knife":3},"海岸区画":{"stone":6,"wood":6,"water":5,"seaweed":8,"swimsuit":5,"rubber":3,"oil":2,"lighter":2,"swordfish":4,"porcupinefish":4,"paradisefish":2,"survival_knife":1,"wood_sword":1},"港湾区画":{"scrap":8,"wood":6,"water":3,"seaweed":3,"swimsuit":2,"rubber":8,"oil":8,"lighter":6,"swordfish":3,"porcupinefish":2,"survival_knife":4,"wood_sword":1},"湖畔区画":{"wood":8,"stone":6,"marble":4,"water":10,"seaweed":8,"swimsuit":2,"rubber":2,"lighter":1,"minefish":6,"paradisefish":6,"wood_sword":2},"水没施設区画":{"scrap":8,"mystery":4,"water":6,"seaweed":5,"swimsuit":4,"rubber":6,"oil":4,"lighter":2,"swordfish":2,"minefish":3,"porcupinefish":2,"paradisefish":3,"survival_knife":2}};
// Each physical object has its own ID. A lap visits every uncollected object once.
const regionObjects=Object.fromEntries(Object.entries(regionStock).map(([area,counts])=>{
 let serial=0;
 return [area,Object.entries(counts).flatMap(([id,count])=>Array.from({length:count},()=>({uid:area+':'+(++serial),id,area,count:(id==='water'||id==='lighter')?3:1,taken:false})))];
}));
const regionSeen=Object.fromEntries(Object.keys(regionStock).map(area=>[area,new Set()]));
function drawRegionItem(area){
 const objects=regionObjects[area]||[];
 let unseen=objects.filter(obj=>!obj.taken&&!regionSeen[area].has(obj.uid)&&!S.found.includes(obj)&&S.pendingFound!==obj);
 if(!unseen.length){
  regionSeen[area].clear();

  if(unseen.length)addLog(area+'の探索が一周した');
 }
 if(!unseen.length)return null;

 return obj;
}
function markObjectTaken(obj){if(obj&&obj.uid){const found=(regionObjects[obj.area]||[]).find(x=>x.uid===obj.uid);if(found){found.taken=true;regionSeen[obj.area].clear();}}}
function stockItemId(obj){return typeof obj==='string'?obj:obj.id}
// Newest first. Every new stock entry moves older entries one slot toward the fourth waiting slot.
function pushStock(obj){

 if(S.found.length>FIND_QUEUE_MAX){const old=S.found.pop();addLog(names[stockItemId(old)]+'の古いストックが押し出された')}
}
function primary(){if(S.busy||S.pendingFound)return;if(S.hp<=0){toast('戦闘不能！再読み込みで最初から');return}S.busy=true;const battle=S.enemy;if(!battle&&S.st<3){S.busy=false;toast('スタミナ不足！休息してね');return}if(!battle){S.st-=3;refresh();setTimeout(()=>{S.busy=false;S.ticks++;let r=Math.random();if(r<.16){S.enemy=true;S.ehp=85;S.stacks=0;S.nextEnemyAction=Date.now()+2100;addLog('訓練ドローンと遭遇！');toast('敵と遭遇！探索が攻撃に切り替わった');}else if(r<.84){let obj=drawRegionItem(S.place);if(obj){addFound(obj);}else{addLog('この区画の素材は採り尽くされている');toast('この区画の素材はなくなった');}}else{addLog('何も見つからなかった');toast('探索したが何もなかった');}refresh()},1000)}else{setTimeout(()=>{S.busy=false;if(!S.enemy)return;const type=weaponType();recordAttack(type);const hit=Math.random()*100<MASTERY_ACCURACY[masteryRank(type)];const dmg=hit?combatDamage(totalStat('attack')+rand(7),ENEMY_STATS.defense,type):0;S.ehp=Math.max(0,S.ehp-dmg);S.stacks=Math.min(S.stacks+1,5);addLog(hit?WEAPON_TYPES[type]+'で'+dmg+'ダメージ！':'攻撃が外れた！');gainXp(1);if(S.ehp===0){gainXp(3);S.enemy=false;addFound('scrap');toast('訓練ドローン撃破！ ガラクタを発見');addLog('訓練ドローンが機能停止した');S.stacks=0}else{toast(hit?dmg+'ダメージ！':'MISS！');}refresh()},1000)}}
function skill(){if(!S.enemy||Date.now()<S.cool||S.st<10)return toast('スキルを使用できません');S.st-=10;S.cool=Date.now()+25000;S.skillUntil=Date.now()+5000;toast('テンポブレイク！敵の行動を遅延');addLog('テンポブレイク発動：5秒間、行動が0.5秒遅くなる');refresh()}
function useItem(id){
 if(!['ration','drink','kit','water','seaweed','seaweed_soup','fried_swordfish','swordfish_sashimi','minefish_sashimi','paradise_sashimi','paradise_platter','paradise_broth'].includes(id)||!S.inventory[id])return toast('アイテムがありません');
 if(id!=='drink'&&id!=='water'&&S.hp>=maxHp())return toast('HPは満タンです');
 if((id==='drink'||id==='water')&&S.st>=maxSt())return toast('スタミナは満タンです');
 takeFromBag(id,1);
 if(id==='ration')S.hp=Math.min(maxHp(),S.hp+20);
 if(id==='drink')S.st=Math.min(maxSt(),S.st+40);
 if(id==='kit')S.hp=Math.min(maxHp(),S.hp+60);
 if(id==='water')S.st=Math.min(maxSt(),S.st+10);
 const hpRecovery={seaweed:10,seaweed_soup:30,fried_swordfish:40,swordfish_sashimi:30,minefish_sashimi:25,paradise_sashimi:20,paradise_platter:100,paradise_broth:30};
 if(hpRecovery[id])S.hp=Math.min(maxHp(),S.hp+hpRecovery[id]);
 addLog(names[id]+'を使用した');
 toast(names[id]+'を使用した');
 refresh();
 if($('back').classList.contains('on')&&$('modalTitle').textContent.startsWith('📦')){if(S.inventory[id])showItem(id);else closeModal();}
}
function rest(){if(S.enemy)return toast('接敵中は休息できません');S.hp=Math.min(maxHp(),S.hp+25);S.st=Math.min(maxSt(),S.st+40);addLog('休息して体力・スタミナを回復した');refresh()}
function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalCloseBtn').textContent=S.pendingFound?'📦 保留':'✕ 閉じる';$('back').classList.add('on')};function closeModal(){if(S.pendingFound){decideFound(false);return}if(S.busy&&$('modalTitle').textContent.startsWith('📦 ストック'))return;$('back').classList.remove('on')}
const itemArt={

 lighter:['tools',0],pickaxe:['tools',1],superpickaxe:['tools',2],greatpickaxe:['tools',3],
 bronze:['metal',0],iron:['metal',1],blackiron:['metal',2],whitesilver:['metal',3],
 silver:['advanced',0],gold:['advanced',1],wonderore:['advanced',2],wonderjewel:['advanced',3],
 ruby:['gems',0],sapphire:['gems',1],diamond:['gems',2],obsidian:['gems',3],
 redstone:['stones',0],bluestone:['stones',1],whitestone:['stones',2],meteorite:['stones',3],
 ragglove:['gloves',0],glove:['gloves',1],reinforced:['gloves',2],plasma:['gloves',3],

};
const itemFallback={water:'💧',hotwater:'♨️',seaweed:'🌿',seaweed_soup:'🍲',swimsuit:'🩳',bikini_pants:'🩳',passion_bikini:'🩳',rubber:'⚫',rubber_gloves:'🧤',rubber_suit:'🦺',insulated_suit:'🦺',charged_suit:'⚡',glue:'🧴',oil:'🛢️',heated_oil:'🫕',swordfish:'🐟',minefish:'🐡',porcupinefish:'🐡',paradisefish:'🐠',wood_sword:'🗡️',survival_knife:'🔪',sea_sword:'⚔️',fried_swordfish:'🍤',swordfish_sashimi:'🍣',minefish_sashimi:'🍣',needle_suit:'🦔',stinger_suit:'🦔',onyx_suit:'🛡️',paradise_sashimi:'🍣',paradise_platter:'🍱',paradise_broth:'🍵',ragglove:'🧤',glove:'🥊',reinforced:'🥊',plasma:'⚡',scrap:'🔩',cloth:'🧵',scissors:'✂️',charcoal:'⚫',core:'🔮',cell:'🔋',steel:'🔧',discharger:'⚡',armguard:'🛡️',ration:'🥪',drink:'🧃',kit:'🩹'};
const readySheets={};
Object.entries(itemArtSheets).forEach(([key,url])=>{
 const img=new Image();img.onload=()=>{readySheets[key]=true;refresh()};img.onerror=()=>{readySheets[key]=false};img.src=url;
});
function itemIconHTML(id){
 const cfg=itemArt[id];
 if(cfg&&readySheets[cfg[0]]){
  const [sheet,quadrant]=cfg;
  const x=quadrant%2===0?0:100,y=quadrant<2?0:100;
  return '<span class="bp-item-art" role="img" aria-label="'+(names[id]||id)+'" style="background-image:url('+itemArtSheets[sheet]+');background-position:'+x+'% '+y+'%"></span>';
 }
 return '<span class="itemIcon">'+(itemFallback[id]||'📦')+'</span>';
}
const inventoryOrder=Object.keys(S.inventory).filter(id=>S.inventory[id]>0);
function orderedInventory(){return S.bag.map(x=>[x.id,x.count])}
function renderInventory(){
 const el=$('inventoryMini');if(!el)return;
 const items=orderedInventory();
 el.innerHTML=Array.from({length:BAG_SLOTS},(_,i)=>{
  const entry=items[i];if(!entry)return '<button class="empty" disabled aria-label="空き枠">＋</button>';
  const [k,n]=entry;
  return `<button onclick="showItemStack(${i})" title="${names[k]} ×${n}">${itemIconHTML(k)}<span class="itemName">${names[k]}</span><span class="itemQty">${n}</span></button>`;
 }).join('');
}
function showItemStack(index){
 const entry=S.bag[index];if(!entry){closeModal();refresh();return}const id=entry.id;
 const healing=['ration','drink','kit','water','seaweed','seaweed_soup','fried_swordfish','swordfish_sashimi','minefish_sashimi','paradise_sashimi','paradise_platter','paradise_broth'].includes(id);
 const related=recipes.filter(r=>Object.hasOwn(r.need,id));
 const controls=[
 healing?`<button onclick="useItem('${id}')">使用する</button>`:'',
 equipmentDef(id)?`<button onclick="equip('${id}')">装備する</button>`:'',
 related.length?`<button onclick="showRecipesFor('${id}')">製作する（${related.length}件）</button>`:'',
 `<button class="dropbtn" onclick="discardStack(${index})">このスタックを捨てる</button>`
 ].filter(Boolean).join('');
 modal('📦 '+names[id],`<p>選択スタック：${entry.count}/${stackLimit(id)}個（同種合計：${S.inventory[id]||0}個）</p><div class="rowItemActions">${controls}</div>`);
}
function showItem(id){const i=S.bag.findIndex(x=>x.id===id);if(i>=0)showItemStack(i);else {closeModal();refresh()}}
function showRecipesFor(id){
 const list=recipes.filter(r=>Object.hasOwn(r.need,id));
 modal('🔧 '+names[id]+'から製作',list.map(r=>{
 const ok=canCraft(r);
 return craftRecipeHTML(r);
 }).join('')||'<p>製作先はありません</p>');
}
function showEquipment(){
 const cards=Object.entries(EQUIPMENT_SLOTS).map(([slot,label])=>{
  const id=equipped(slot),def=equipmentDef(id);
  return `<div class="bp-equip-card"><b>${label}</b><div class="bp-equip-item">${id?itemIconHTML(id)+' '+names[id]:'未装備'}</div>
  ${id?`<small>攻撃 +${def.attack||0} / 防御 +${def.defense||0}</small><button onclick="unequip('${slot}')">外す</button>`:''}</div>`;
 }).join('');
 const ranks=Object.keys(WEAPON_TYPES).map(t=>WEAPON_TYPES[t]+' '+MASTERY_RANKS[masteryRank(t)]+' ('+masteryProgress(t)+')').join(' ／ ');
 modal('🛡️ 装備・熟練度',`<div class="bp-equip-stats">Lv.${S.level} (${levelProgress()})　HP ${S.hp}/${maxHp()}　ST ${S.st}/${maxSt()}<br>攻撃 ${totalStat('attack')}　防御 ${totalStat('defense')}<br>${ranks}</div><div class="bp-equip-grid">${cards}</div><button onclick="showBag()">🎒 所持品から装備</button>`);
}
function showBag(){
 const slots=orderedInventory().map(([k,v],i)=>{
  const canUse=['ration','drink','kit','water','seaweed','seaweed_soup','fried_swordfish','swordfish_sashimi','minefish_sashimi','paradise_sashimi','paradise_platter','paradise_broth'].includes(k);
  const useButton=canUse?`<button onclick="useItem('${k}')">使用</button>`:'';
  const equipButton=equipmentDef(k)?`<button onclick="equip('${k}')">装備</button>`:'';
  return `<div class="slot">${names[k]} × ${v}/${stackLimit(k)}${useButton}${equipButton}<button class="dropbtn" onclick="discardStack(${i})">このスタックを捨てる</button></div>`;
 });
 while(slots.length<BAG_SLOTS)slots.push('<div class="slot empty">空き枠</div>');
 modal('🎒 所持品 '+occupied()+'/'+BAG_SLOTS+'枠','<p class="small">同じ種類も上限を超えると別枠です。</p><div class="slotgrid">'+slots.join('')+'</div>');
}
function canCraft(r){const after=craftConsumption(r);return !!after&&!!addToStacks(after.stacks,r.id,r.count||1)}
function craftRecipeHTML(r){
 const ok=canCraft(r);
 const materials=Object.entries(r.need).map(([id,need])=>{
  const owned=(S.inventory[id]||0)+(Object.values(S.equipment).includes(id)?1:0);
  const enough=owned>=need;
  return `<div class="bp-craft-material ${enough?'enough':'missing'}">${itemIconHTML(id)}<span class="bp-craft-material-name">${names[id]}</span><span class="bp-craft-count">${owned}/${need}</span></div>`;
 }).join('');
 return `<div class="recipe bp-craft-card" data-recipe-id="${r.id}">
  <div class="bp-craft-head">${itemIconHTML(r.id)}<div class="bp-craft-info"><strong>${r.name}</strong><span>${r.desc||''}</span></div><span class="bp-craft-status ${ok?'ready':'locked'}">${ok?'製作可能':'素材を確認'}</span></div>
  <div class="bp-craft-materials">${materials}</div>
  <button ${ok?'':'disabled'} onclick="craft('${r.id}','${r.category}')">${ok?'🔧 製作する':'素材不足／満杯'}</button>
  ${recipes.some(next=>Object.hasOwn(next.need,r.id))?`<button class="bp-related-link" onclick="focusRelatedRecipe(\'${r.id}\')">↗ 関連製作へ</button>`:'' }
 </div>`;
}
// Recipe subcategories are independent of rarity and can be extended as new items arrive.
const CRAFT_SUBCATEGORIES={
 weapon:[['fist','拳'],['slash','斬り']],
 armor:[['head','頭'],['arm','腕'],['body','身体'],['legs','脚'],['accessory','アクセ']],
 item:[['recovery','回復'],['mineral','鉱石・金属系'],['plant','植物系'],['other','その他']]
};
const ITEM_CRAFT_GROUP={
 kit:'recovery',bronze:'mineral',iron:'mineral',steel:'mineral',blackiron:'mineral',
 silver:'mineral',whitesilver:'mineral',gold:'mineral',wonderore:'mineral',
 wonderjewel:'mineral',ruby:'mineral',sapphire:'mineral',diamond:'mineral',
 charcoal:'plant',discharger:'other',
 hotwater:'other',seaweed_soup:'recovery',glue:'other',heated_oil:'other',fried_swordfish:'recovery',swordfish_sashimi:'recovery',minefish_sashimi:'recovery',paradise_sashimi:'recovery',paradise_platter:'recovery',paradise_broth:'recovery'
};
let selectedCraftSubcategory=null;
function recipeSubcategory(r){
 if(r.category==='weapon')return EQUIPMENT_DEFS[r.id]?.weaponType||'fist';
 if(r.category==='armor')return EQUIPMENT_DEFS[r.id]?.slot||'body';
 return ITEM_CRAFT_GROUP[r.id]||'other';
}
let craftOrigin=null;
function currentCraftScroll(){return document.querySelector('.modal')?.scrollTop||0}
function refreshCraftCards(){
 document.querySelectorAll('[data-recipe-id]').forEach(el=>{
  const r=recipes.find(x=>x.id===el.dataset.recipeId);if(!r)return;
  const replacement=document.createElement('div');replacement.innerHTML=craftRecipeHTML(r);
  el.replaceWith(replacement.firstElementChild);
 });
}
function focusRelatedRecipe(sourceId){
 const related=recipes.filter(r=>Object.hasOwn(r.need,sourceId));
 if(!related.length)return;
 if(!craftOrigin){craftOrigin={category:document.querySelector('.craftTabs button.selected')?.getAttribute('onclick')?.match(/showCraft\('([^']+)'/)?.[1]||'item',subcategory:selectedCraftSubcategory,scroll:currentCraftScroll(),source:sourceId}}
 const html='<button onclick="returnToCraft()">← 元の製作一覧へ戻る</button><p class="small">'+names[sourceId]+'を素材とするレシピ</p><div class="craft bp-craft-list">'+related.map(craftRecipeHTML).join('')+'</div>';
 modal('🔧 関連製作',html);
}
function returnToCraft(){
 if(!craftOrigin)return showCraft();
 const origin=craftOrigin;craftOrigin=null;
 showCraft(origin.category,origin.subcategory);
 const list=document.querySelector('[data-recipe-id="'+origin.source+'"]');
 if(list)list.scrollIntoView({block:'nearest'});
 else document.querySelector('.modal').scrollTop=origin.scroll;
}
function showCraft(category='weapon',subcategory=null){
 craftOrigin=null;
 const tabs=[['weapon','🥊 武器'],['armor','🛡️ 防具'],['item','🧰 アイテム']];
 const groups=CRAFT_SUBCATEGORIES[category]||CRAFT_SUBCATEGORIES.item;
 const active=groups.some(([key])=>key===subcategory)?subcategory:groups[0][0];
 selectedCraftSubcategory=active;
 const tabHtml='<div class="craftTabs">'+tabs.map(([key,label])=>`<button class="${category===key?'selected':''}" onclick="showCraft('${key}')">${label}</button>`).join('')+'</div>';
 const subHtml='<div class="craftTabs bp-craft-subtabs">'+groups.map(([key,label])=>`<button class="${active===key?'selected':''}" onclick="showCraft('${category}','${key}')">${label}</button>`).join('')+'</div>';
 const list=recipes.filter(r=>r.category===category&&recipeSubcategory(r)===active).sort((a,b)=>Number(canCraft(b))-Number(canCraft(a)));
 const body='<p class="small">製作可能なアイテムを上に表示。装備中の素材も使えます。</p>'+tabHtml+subHtml+'<div class="craft bp-craft-list">'+
 (list.length?list.map(craftRecipeHTML).join(''):'<p class="small">この分類のレシピはまだありません。</p>')+'</div>';
 modal('🔧 製作',body);
}
function craft(id,category){
 const r=recipes.find(x=>x.id===id);if(!r||!canCraft(r))return toast('素材不足または所持品が満杯');
 const after=craftConsumption(r);if(!after)return toast('素材不足');
 const packed=addToStacks(after.stacks,id,r.count||1);if(!packed)return toast('完成品が全量入らない');
 S.bag=packed;syncInventory();S.equipment=after.equipment;
 const rarity=RECIPE_RARITY[id]||'common';gainXp(CRAFT_XP[rarity]);const weapon=EQUIPMENT_DEFS[id];if(weapon?.slot==='weapon')addMastery(weapon.weaponType,CRAFT_MASTERY[rarity]);
 addLog(r.name+'を製作した！ (+'+CRAFT_XP[rarity]+'XP)');toast('🔧 '+r.name+'完成！');refresh();
 if($('back').classList.contains('on')&&$('modalTitle').textContent.includes('製作'))refreshCraftCards();
}
function showMap(){
 const cards=Object.keys(regionStock).map(area=>{
  const current=area===S.place,art=stageArtRegistry.backgrounds[area]||'';
  return `<button type="button" class="bp-region-card ${current?'current':''}" onclick="move('${area}')" ${current?'disabled':''} aria-label="${area}${current?' 現在地':'へ移動'}">
   <span class="bp-region-image" style="background-image:linear-gradient(0deg,#07111cf0 0%,#07111c00 72%),url('${art}')"></span>
   <span class="bp-region-footer"><strong>${area}</strong><small>${current?'● 現在地':'移動する ›'}</small></span>
  </button>`;
 }).join('');
 modal('📍 エリア選択',`<div class="bp-region-picker"><p class="bp-region-guide">行きたい区画の背景をタップして移動！　現在地：<b>${S.place}</b>　／　移動時スタミナ −5</p><div class="bp-region-grid">${cards}</div></div>`);
}
function move(p){if(S.busy||S.pendingFound)return toast('探索中は移動できません');S.place=p;S.enemy=false;S.stacks=0;S.found=[];S.st=Math.max(0,S.st-5);addLog(p+'へ移動した（発見履歴は破棄）');closeModal();refresh()}
setInterval(()=>{if(S.remaining>0)S.remaining--;refresh()},1000);
setInterval(()=>{if(!S.enemy||S.hp<=0)return;let now=Date.now();if(!S.nextEnemyAction)S.nextEnemyAction=now+2000;if(now>=S.nextEnemyAction){let slowed=now<S.skillUntil;S.nextEnemyAction=now+2000+(slowed?500:0);let hit=Math.max(1,Math.floor(rand(7)+5-totalStat('defense')*0.5));S.hp=Math.max(0,S.hp-hit);addLog('訓練ドローンの攻撃！ '+hit+'ダメージ');if(S.hp===0){S.enemy=false;toast('HPが0！ 演習脱落');}refresh()}},200);
addLog('仮想演習へログインした。');addLog('山岳区画で素材を探索しよう。素材の配置数には上限がある。');refresh();
