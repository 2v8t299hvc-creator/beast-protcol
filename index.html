function craftConsumption(r,actor=S){
 let stacks=actor.bag.map(x=>({...x})),equipment={...actor.equipment},equipmentAmmo={...actor.equipmentAmmo},equipmentEffects={...actor.equipmentEffects};
 for(const [id,count] of Object.entries(r.need)){
  let left=count,fromBag=Math.min(totalIn(stacks,id),left);
  if(fromBag){stacks=removeFromStacks(stacks,id,fromBag);left-=fromBag}
  if(left){const slot=Object.keys(equipment).find(k=>equipment[k]===id);if(slot&&left===1){equipment[slot]=null;delete equipmentAmmo[slot];delete equipmentEffects[slot];left--}}
  if(left)return null;
 }return {stacks,equipment,equipmentAmmo,equipmentEffects};
}

function addToStacks(stacks,id,count,metadata=null){
 if(AMMO_LIMITS[id]&&totalIn(stacks,id)+count>AMMO_LIMITS[id])return null;
 const next=stacks.map(x=>({...x}));let left=count,lim=stackLimit(id);
 for(const x of next){if(x.id!==id||!left)continue;let n=Math.min(lim-x.count,left);x.count+=n;left-=n}
 while(left>0&&next.length<BAG_SLOTS){let n=Math.min(lim,left);next.push({id,count:n,...(equipmentDef(id)?.ammoType&&!equipmentDef(id).unlimitedAmmo?{ammo:weaponAmmo(id,metadata?.ammo??equipmentDef(id).capacity)}:{}),...(equipmentDef(id)?.slot==='weapon'||metadata?.effects?{effects:equipmentInstanceEffects(id,metadata?.effects)}:{})});left-=n}
 return left===0?next:null;
}
function removeFromStacks(stacks,id,count){
 let next=stacks.map(x=>({...x}));if(next.filter(x=>x.id===id).reduce((n,x)=>n+x.count,0)<count)return null;
 let left=count;for(let i=0;i<next.length&&left;){if(next[i].id!==id){i++;continue}const n=Math.min(left,next[i].count);next[i].count-=n;left-=n;if(!next[i].count)next.splice(i,1);else i++}return next;
}

const ITEM_SHEET_CONCURRENCY=4,ITEM_SHEET_MAX_ATTEMPTS=3;

function pumpItemSheets(){
 while(activeItemSheetLoads<ITEM_SHEET_CONCURRENCY&&itemSheetQueue.length){
  const key=itemSheetQueue.shift(),state=itemSheetStates[key];if(!state||state.status!=='queued')continue;
  state.status='loading';state.attempts++;activeItemSheetLoads++;

   if(ok){readySheets[key]=true;loadedSheetUrls[key]=url;state.status='ready';hydrateItemArt(key);refresh()}
   else{

    if(state.attempts<ITEM_SHEET_MAX_ATTEMPTS){
     state.status='retry';setTimeout(()=>{state.status='queued';itemSheetQueue.push(key);scheduleItemSheetPump()},state.attempts*1000);

   }

let rarityNamePattern=null,rarityNameIds=null;
function colorItemNames(root){
 if(!root||!document.createTreeWalker)return;
 if(!rarityNamePattern){
  rarityNameIds=new Map(Object.entries(names).filter(([,name])=>typeof name==='string'&&name.length>=1).map(([id,name])=>[name,id]));
  const escape=value=>[...value].map(char=>(char.charCodeAt(0)===92||'^$.*+?()[]{}|'.includes(char))?String.fromCharCode(92)+char:char).join('');
  rarityNamePattern=new RegExp([...rarityNameIds.keys()].sort((a,b)=>b.length-a.length).map(escape).join('|'),'g');
 }
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];let node;
 while(node=walker.nextNode()){
  if(!node.nodeValue||!node.parentElement||node.parentElement.closest('.bp-rarity-name,script,style,.bp-item-art'))continue;
  rarityNamePattern.lastIndex=0;if(rarityNamePattern.test(node.nodeValue))nodes.push(node);
 }
 for(const text of nodes){
  const fragment=document.createDocumentFragment();let start=0;
  rarityNamePattern.lastIndex=0;
  for(const match of text.nodeValue.matchAll(rarityNamePattern)){
   if(match[0].length===1&&/[一-龯ぁ-ゖァ-ヺ]/.test((text.nodeValue[match.index-1]||'')+(text.nodeValue[match.index+1]||'')))continue;
   if(match.index>start)fragment.appendChild(document.createTextNode(text.nodeValue.slice(start,match.index)));
   const span=document.createElement('span');span.className='bp-rarity-name';
   span.dataset.rarity=RECIPE_RARITY[rarityNameIds.get(match[0])]||'common';span.textContent=match[0];fragment.appendChild(span);
   start=match.index+match[0].length;
  }
  if(start<text.nodeValue.length)fragment.appendChild(document.createTextNode(text.nodeValue.slice(start)));
  text.replaceWith(fragment);
 }
}

 const slots=actor.bag.filter(x=>RECOVERY_ITEMS[x.id]?.group===item.group),limit=item.group==='hp'?policy.hpSlots:1;
 if(actor.inventory[id]>0||slots.length<limit)return true;
 return amount>=120&&item.group==='hp'&&comRecoveryTotal(actor,'hp',120)<policy.largeTarget||amount>=2*Math.min(...slots.map(x=>recoveryAmount(actor,x.id)));
}
function comBuildReady(actor){
 return ['epic','legendary'].includes(RECIPE_RARITY[actor.equipment.weapon])&&['head','arm','body','legs'].every(slot=>['rare','epic','legendary'].includes(RECIPE_RARITY[actor.equipment[slot]]));
}
function comReserveTurn(actor,gearPlan,reservePlan,gearReady,now){
 if(!reservePlan)return false;
 const emergency=actor.hp<actorMax(actor,'hp')*.35&&comRecoveryTotal(actor)<60;
 if(gearReady&&!emergency)return false;
 if(comAmmoResupplyPlan(actor,gearPlan,now)&&!emergency)return false;
 // A failed food search must not take over the rest of the build, even at low stock.
 if((actor.recoveryTripUntil||0)&&now>=actor.recoveryTripUntil){
  actor.recoveryTripUntil=0;actor.recoveryBuildPauseUntil=now+(comBuildReady(actor)?20000:45000);
 }
 const recipe=reservePlan.recipeId&&recipes.find(r=>r.id===reservePlan.recipeId),after=recipe&&craftConsumption(recipe,actor);
 if(after&&addToStacks(after.stacks,recipe.id,craftOutputCount(actor,recipe)))return true;
 if(now<(actor.recoveryBuildPauseUntil||0)&&!emergency)return false;
 const building=!!gearPlan.id&&!comBuildReady(actor);
 if(building&&!emergency&&comRecoveryTotal(actor)>=90&&(actor.gearCraftsSinceReserve||0)<3)return false;
 if(!actor.recoveryTripUntil)actor.recoveryTripUntil=now+(building?(reservePlan.expectedHeal>=120&&['rare','epic','legendary'].includes(RECIPE_RARITY[actor.equipment.weapon])?25000:10000):40000);

}
function comUnderFire(actor,now){const n=actor.damageNotice;return !!(n&&n.at<=now&&now-n.at<=8000&&n.area===actor.place)}
function comShouldBurnSpirit(actor,now,target=null){
 if(actor.character!=='kankan'||actor.hp<actorMax(actor,'hp')*.85||now<(actor.characterFieldReadyAt||0))return false;
 if(!target&&!comUnderFire(actor,now))return false;
 const consumed=Math.floor(actor.hp*.4),incoming=target?evaluateCombat(actor,target,now,'player').incoming:actorMax(actor,'hp')*.2;
 return actor.hp-consumed>incoming*2&&comRecoveryTotal(actor)>=consumed&&Math.max(0,(actor.recoveryReadyAt.hp||0)-now)<=RECOVERY_COOLDOWN_MS;
}
function comLeaveUnderFire(actor,plan,now){
 const notice=actor.damageNotice;
 if(!notice||notice.at>now||now-notice.at>8000||notice.area!==actor.place||!safeComRetreat(actor,now))return false;
 if(actor.hp>=actorMax(actor,'hp')*.65&&!Object.keys(BODY_INJURIES).some(part=>hasBodyInjury(actor,part)))return false;
 cancelBodyTreatment(actor);actor.restMode=null;
 const hp=comSelectRecovery(actor,'hp',now,true);if(hp&&actorMax(actor,'hp')-actor.hp>=hp.amount*.8)recoverActor(actor,hp.id,now);
 const st=comSelectRecovery(actor,'stamina',now);if(st&&actor.st<6)recoverActor(actor,st.id,now);
 // Legs can raise the movement cost to six. Do not flee by paying a lethal HP cost.
 if(actor.hp+actor.st<=6){actor.st=Math.min(actorMax(actor,'stamina'),actor.st+restRecoveryRate(actor));comLog(actor,'被弾：退避に必要なスタミナを確保',now);return true}
 actor.dangerAreas||={};actor.dangerAreas[actor.place]=now+90000;
 if(comMove(actor,now,'被弾したため治療を中断して退避',plan,true)){bumpMatchStat(actor,'retreats');recordMatchEvent(actor,'retreat','被弾した場所を離れて立て直す',now);return true}
 comLog(actor,'被弾：移動可能になるのを待って退避',now);return true;
}
function stepCom(actor,now){
 updateStatusEffects(now,actor);
 if(actor.place==='待機所'){
  if(!actor.starterWeapon){if(comWeaponTypes(actor).length>1){const plan=comCurrentPlan(actor),type=equipmentDef(plan.id)?.weaponType;if(type)actor.preferredWeaponType=type;}actor.starterWeapon=actor.preferredWeaponType==='gun'?'practice_gun':actor.preferredWeaponType==='hammer'?'practice_hammer':actor.preferredWeaponType==='slash'?'practice_sword':actor.preferredWeaponType==='fist'?'practice_gauntlet':'practice_bow';actor.equipment.weapon=actor.starterWeapon;equipmentState(actor,'weapon');if(equipmentDef(actor.starterWeapon)?.ammoType)actor.equipmentAmmo.weapon=20;comLog(actor,names[actor.starterWeapon]+'を選択',now);return}
  comMove(actor,now,'待機所から出発');return;
 }
 if(matchClock.section===0)return;
 let plan=comCurrentPlan(actor,now);
 if(nextClosingAreas().includes(actor.place)&&matchClock.sectionEndsAt-now<=COM_POLICY.warningMs){if(comMove(actor,now,'封鎖予告を見て退避',plan))return}
 if(pvpEnabled()&&actor.opponent){actor.restMode=null;cancelBodyTreatment(actor);comFightOpponent(actor,now);return}
 if(pvpEnabled()&&comFinalArea()){comFinalSearch(actor,now);return}
 // A recent personally inflicted injury favors another paid, random search, never free sight.
 if(comShouldPressInjury(actor,now)){comFinalSearch(actor,now);return}
 if(comLeaveUnderFire(actor,plan,now))return;
 // Damage gives urgency, never a target: pay for a fresh, random local search.
 if(comUnderFire(actor,now)){comFinalSearch(actor,now);return}
 if(actor.enemy){comFight(actor,now);return}
 if(actor.leaveDanger){comMove(actor,now,'敵から離れる',plan);return}
 if(actor.bodyTreatment){if(!updateBodyTreatment(actor,now))return}
 const injuredPart=Object.keys(BODY_INJURIES).find(part=>hasBodyInjury(actor,part));
 if(injuredPart){beginBodyTreatment(actor,injuredPart,now);return}
 if(actor.character==='zakuro'&&now>=(actor.characterFieldReadyAt||0)){const id=comMineralChoice(actor,plan);if(id&&consumeMineral(actor,id,now))return}
 if(actor.character==='bjorn'&&now>=(actor.characterFieldReadyAt||0)&&(canReceive('herb',actor.bag)||canReceive('small_flower',actor.bag))&&gatherHerbs(actor,now))return;
 const policy=comRecoveryPolicy(actor),hpMissing=actorMax(actor,'hp')-actor.hp;
 const hpChoice=comSelectRecovery(actor,'hp',now);
 const reservePlan=comRecoveryPlan(actor,now,plan);
 // Small stocks can be cooked before being spent, while emergencies use whatever is available.
 const upgradeReady=reservePlan?.recipeId&&craftConsumption(recipes.find(r=>r.id===reservePlan.recipeId),actor);
 if(hpChoice&&(actor.hp<actorMax(actor,'hp')*.65||hpMissing>=hpChoice.amount*.8)&&(!upgradeReady||actor.hp<actorMax(actor,'hp')*.4||hpChoice.amount>=60)){
  if(recoverActor(actor,hpChoice.id,now)){actor.restMode=null;actor.recoverySeeking=false;comLog(actor,names[hpChoice.id]+'を使用',now);return}
 }
 // A ready meal can restore a stranded COM; do not enter treatment before cooking it.
 if(reservePlan?.recipeId&&comRecoveryTotal(actor)<60){
  const r=recipes.find(r=>r.id===reservePlan.recipeId),after=r&&craftConsumption(r,actor);
  if(RECOVERY_ITEMS[r?.id]?.group==='hp'&&after&&addToStacks(after.stacks,r.id,craftOutputCount(actor,r))&&craftActor(actor,r,now)){actor.restMode=null;comLog(actor,'手持ち素材で回復を制作：'+names[r.id],now);return}
 }
 const minHp=Math.max(actorMax(actor,'hp')*.2,Math.max(0,searchStaminaCost(actor)-actor.st)+((actor.injuryUntil||0)>now?4:0)+Math.max(0,5-actor.st)+1);
 if(actor.hp<=minHp||actor.restMode==='hp'&&actor.hp<actorMax(actor,'hp')*.5){
  actor.restMode='hp';actor.hp=Math.min(actorMax(actor,'hp'),actor.hp+treatmentRate(actor));comLog(actor,'物資を探せる体力まで治療',now);return;
 }
 const stChoice=comSelectRecovery(actor,'stamina',now);
 if(actor.st<actorMax(actor,'stamina')*.3&&stChoice&&recoverActor(actor,stChoice.id,now)){actor.restMode=null;comLog(actor,names[stChoice.id]+'を使用',now);return}
 if(actor.st<searchStaminaCost(actor)+5||actor.restMode==='stamina'&&actor.st<actorMax(actor,'stamina')*.5){
  actor.restMode='stamina';actor.st=Math.min(actorMax(actor,'stamina'),actor.st+restRecoveryRate(actor));comLog(actor,'行動できるスタミナまで休憩',now);return;
 }
 actor.restMode=null;
 const gearReady=plan.crafts.some(id=>{const r=recipes.find(r=>r.id===id),after=r&&craftConsumption(r,actor);return after&&!!addToStacks(after.stacks,r.id,craftOutputCount(actor,r))});
 const reservePriority=comReserveTurn(actor,plan,reservePlan,gearReady,now);
 if(!reservePriority&&reservePlan){
  const held=actor.bag.filter(x=>(reservePlan.needed[x.id]||0)>0&&!RECOVERY_ITEMS[x.id]);
  if(held.length<=2){const needed={...plan.needed};for(const x of held)needed[x.id]=Math.max(needed[x.id]||0,reservePlan.needed[x.id]);plan={...plan,needed}}
 }
 if(reservePriority){
  const needed={...plan.needed};for(const [id,n]of Object.entries(reservePlan.needed))needed[id]=Math.max(needed[id]||0,n);
  plan={...reservePlan,needed};actor.recoveryRoute=plan.routeKey;actor.recoveryGoal=plan.recipeId||Object.keys(plan.missing)[0];
 }else actor.recoveryGoal=null;
 if(comShouldBurnSpirit(actor,now)&&burnSpirit(actor,now))return;
 if(actor.character==='raku'&&modifyEquippedWeapon(actor,now))return;
 if(actor.loot&&comLoot(actor,now,plan))return;
 if(comEquipBetter(actor,now))return;
 if(comDiscardRedundantWeapon(actor,plan,now))return;
 if(weaponAmmo(actor.equipment.weapon,actor.equipmentAmmo.weapon)<=Math.floor(weaponCapacity(actor.equipment.weapon,actor)/4)&&reloadActor(actor,now)){comLog(actor,(equipmentDef(actor.equipment.weapon)?.ammoType==='bullets'?'銃弾':'矢')+'を補充・装填',now);return}
 for(const id of plan.crafts){const r=recipes.find(x=>x.id===id);if(!craftConsumption(r,actor))continue;
  if(craftActor(actor,r,now)){actor.noProgress=0;if(plan.recovery){if(id===plan.recipeId){actor.recoveryBuildPauseUntil=now+(comBuildReady(actor)?20000:45000);actor.recoveryTripUntil=0;actor.gearCraftsSinceReserve=0}}else actor.gearCraftsSinceReserve=(actor.gearCraftsSinceReserve||0)+1;comLog(actor,(plan.recovery?'回復を備蓄するため制作：':'目標のため制作：')+names[id],now);return}
  if(comMakeRoom(actor,id,craftOutputCount(actor,r),plan,now))return;
 }
 plan=comAmmoResupplyPlan(actor,plan,now)||plan;
 const localNeed=Object.keys(plan.missing).some(id=>regionStock[actor.place][id]);
 if(((plan.id||plan.recovery||plan.ammunition)&&!localNeed)||actor.noProgress>=COM_POLICY.searchesWithoutProgress||actor.searches>=COM_POLICY.maxSearchesPerVisit){
  if(comMove(actor,now,plan.ammunition?'弾薬補充のため移動':plan.recovery?'回復アイテムを求めて移動':plan.id&&!localNeed?'不足素材を求めて移動':'探索を続けたため別区画へ',plan))return;

 }
 // Discover only local corpses and drones during a paid search, matching player search probabilities.
 if(!paySearchCost(actor,now))return;actor.searches++;actor.noProgress++;recordExploration(actor,now);
 const efficient=consumeEfficiency(actor);if(efficient)comLog(actor,'効率重視：アイテム3個を探索',now);
 const opponent=!efficient&&pvpEnabled()?chooseLocalOpponent(actor):null;
 if(opponent&&Math.random()<actorDiscoveryRate(opponent,actor,now)){observeOpponent(actor,opponent,now);actor.restMode=null;comLog(actor,'探索：'+actorName(opponent)+'を発見',now);return}
 const bodies=efficient?[]:corpses.filter(c=>corpseAvailable(c,now)&&c.area===actor.place&&c.items.length>0&&S.corpseVisit?.id!==c.id);
 const body=bodies.length?bodies[rand(bodies.length)]:null;
 if(body&&Math.random()<corpseDiscoveryRate(body,actor)){actor.loot=body.id;comLog(actor,'探索：死体を発見',now);return}
 const present=efficient?[]:Object.values(drones).filter(d=>d.spawned&&d.hp>0&&d.area===actor.place);
 if(present.length&&Math.random()<droneDiscoveryRate(actor)){
  const d=present[rand(present.length)];actor.enemy={kind:d.kind,generation:d.generation};actor.restMode=null;
  comLog(actor,'探索：'+DRONE_DEFS[d.kind].name+'を発見',now);return;
 }
 if(!efficient&&Math.random()>=0.84){comLog(actor,'探索：何も見つからない',now);awardEmptySearchXp(actor,now);return}
 const items=efficient?drawSearchBatch(actor,3):drawSearchBatch(actor);
 if(!items.length){actor.exhausted[actor.place]=true;comLog(actor,'探索して物資切れを確認',now);awardEmptySearchXp(actor,now);return}
 let madeRoom=false;
 for(const obj of items){
  if(comWants(actor,obj.id,plan)){
   if(receive(obj.id,obj.count||1,obj,actor)){markObjectTaken(obj);actor.noProgress=0;comLog(actor,'探索・取得：'+names[obj.id]+' ×'+(obj.count||1),now);continue}
   // At most one discard per action; unclaimed physical objects stay in the region.
   if(!madeRoom)madeRoom=comMakeRoom(actor,obj.id,obj.count||1,plan,now);
  }

 }
}
function updateComActors(now){
 if(!matchClock||matchClock.ended)return;
 while(!matchClock.ended){
  const due=comActors.filter(a=>a.hp>0&&a.nextActionAt<=now),counterAt=Math.min(Infinity,...delayedDroneCounters.filter(x=>x.dueAt<=now).map(x=>x.dueAt));
  const pendingAt=pvpEnabled()?Math.min(S.pvpPending?.dueAt??Infinity,S.pvpFeedback?.until??Infinity):Infinity,pvpAt=pendingAt<=now?pendingAt:Infinity;
  if(!due.length&&counterAt===Infinity&&pvpAt===Infinity)break;
  const at=Math.min(counterAt,pvpAt,...due.map(a=>a.nextActionAt));
  updatePvpTimeline(at);if(matchClock.ended)break;updateDelayedDroneCounters(at);if(matchClock.ended)break;updateDrones(at);pruneCorpses(at);
  // Rotate equal-time priority each second; this order is identical after a background resume.
  const offset=Math.floor((at-matchClock.startedAt)/COM_ACTION_MS)%comActors.length;
  const order=comActors.slice(offset).concat(comActors.slice(0,offset));
  for(const actor of order){
   if(matchClock.ended)break;
   if(actor.hp<=0||actor.nextActionAt>at)continue;
   actor.nextActionAt=at+COM_ACTION_MS+actionDelayMs(actor,at);
   if((actor.combatReadyAt||0)<=at)stepCom(actor,at);
   checkVictory(at);
  }
 }

 }).join('')+'<button onclick="showComStatus()">更新</button>');
